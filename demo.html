<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tengella CleanFlow — Demo video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --fg:#1A1F24; --muted:#6A7177; --line:#E3E6E2;
  --header:#4A82C8; --on-header:#FFFFFF;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121416; --surface:#181B1E; --fg:#E7E9E6; --muted:#9BA2A7; --line:#2A2F33;
  --header:#22406A; --on-header:#EEF3FA;
  color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
header{background:var(--header);color:var(--on-header);padding:14px 32px;display:flex;align-items:center;justify-content:space-between}
header a{color:inherit;text-decoration:none;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:32px}
h1{font-size:22px;font-weight:700;margin:0 0 4px}
p{color:var(--muted);margin:0 0 24px}
video{display:block;width:100%;height:auto;background:#000;border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body>
<header>
  <a href="./">Tengella CleanFlow</a>
  <a href="./">Open prototype →</a>
</header>
<main>
  <h1>Demo video</h1>
  <p>Walkthrough of the AI agent marketplace prototype.</p>
  <video controls preload="metadata" playsinline>
    <source src="tengella.mp4" type="video/mp4">
    Your browser can't play this video. <a href="tengella.mp4">Download it</a> instead.
  </video>
</main>
</body>
</html>
